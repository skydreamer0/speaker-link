[workspace]
members = [
    "crates/speakerlink-core",
    "crates/speakerlink-windows",
    "crates/speakerlink-cli",
    "crates/speakerlink-app",
]
resolver = "2"

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/skydreamer0/speaker-link"
publish = false

[workspace.dependencies]
speakerlink-core = { path = "crates/speakerlink-core" }
speakerlink-windows = { path = "crates/speakerlink-windows" }
