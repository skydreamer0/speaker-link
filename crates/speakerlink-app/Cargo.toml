[package]
name = "speakerlink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version = "1.95"

[dependencies]
speakerlink-core.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "glow", "default_fonts", "x11"], optional = true }

[features]
default = []
native-ui = ["dep:eframe"]

[[bin]]
name = "speakerlink-app"
path = "src/main.rs"
required-features = ["native-ui"]
